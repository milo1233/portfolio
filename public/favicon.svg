<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="120" height="120" rx="28" ry="28" fill="url(#bg)"/>
  <!-- Cute face: eyes -->
  <circle cx="44" cy="52" r="6" fill="#fff"/>
  <circle cx="84" cy="52" r="6" fill="#fff"/>
  <!-- Cute face: pupils -->
  <circle cx="46" cy="51" r="3" fill="#1e1b4b"/>
  <circle cx="86" cy="51" r="3" fill="#1e1b4b"/>
  <!-- Cute face: eye sparkle -->
  <circle cx="48" cy="49" r="1.2" fill="#fff"/>
  <circle cx="88" cy="49" r="1.2" fill="#fff"/>
  <!-- Cute smile -->
  <path d="M 44 72 Q 64 88 84 72" stroke="#fff" stroke-width="4" stroke-linecap="round" fill="none"/>
  <!-- Blush cheeks -->
  <ellipse cx="34" cy="68" rx="8" ry="5" fill="#f0abfc" opacity="0.4"/>
  <ellipse cx="94" cy="68" rx="8" ry="5" fill="#f0abfc" opacity="0.4"/>
  <!-- Small code brackets < /> on forehead -->
  <text x="64" y="38" text-anchor="middle" font-family="monospace" font-size="14" font-weight="bold" fill="#e0e7ff" opacity="0.7">&lt;/&gt;</text>
</svg>
